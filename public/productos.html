<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel POS · Inventario</title>
  <script src="/vendor/tailwind.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: { brand: { 50:'#fdf2f8',500:'#db2777',600:'#be185d',700:'#9d174d' } } } } };</script>
  <script src="/vendor/lucide.min.js"></script>
  <style>[data-lucide]{width:1.1em;height:1.1em}</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <header class="bg-white border-b border-slate-200 px-5 h-14 flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-brand-600 text-white grid place-items-center mr-3"><i data-lucide="shopping-bag"></i></div>
    <nav class="flex gap-1 text-sm">
      <a href="/" class="px-3 py-1.5 rounded-md hover:bg-slate-100 flex items-center gap-1.5"><i data-lucide="scan-barcode"></i>Vender</a>
      <a href="/productos.html" class="px-3 py-1.5 rounded-md bg-brand-50 text-brand-700 font-medium flex items-center gap-1.5"><i data-lucide="package"></i>Inventario</a>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto p-5 grid lg:grid-cols-[1fr_340px] gap-5">
    <!-- Formulario -->
    <form id="pform" class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4 text-sm">
      <h1 class="text-lg font-semibold">Nuevo producto</h1>
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2"><label class="block text-slate-600 mb-1">Nombre *</label>
          <input name="name" required class="w-full border rounded-md px-3 py-2" placeholder="Blusa de seda manga larga" /></div>
        <div><label class="block text-slate-600 mb-1">Código / estilo</label><input name="code" class="w-full border rounded-md px-3 py-2" placeholder="BLU-SEDA" /></div>
        <div><label class="block text-slate-600 mb-1">Marca</label><input name="brand" class="w-full border rounded-md px-3 py-2" /></div>
        <div><label class="block text-slate-600 mb-1">Categoría *</label><select name="category_id" required class="w-full border rounded-md px-2 py-2"></select></div>
        <div><label class="block text-slate-600 mb-1">Impuesto</label><select name="tax_rate_id" class="w-full border rounded-md px-2 py-2"><option value="">Según categoría</option></select></div>
      </div>

      <div class="rounded-xl bg-brand-50 p-4 grid grid-cols-3 gap-3">
        <div><label class="block text-slate-700 mb-1 font-medium">Costo bruto (L) *</label>
          <input name="cost" required inputmode="decimal" class="w-full border rounded-md px-3 py-2 text-lg" placeholder="0.00" /></div>
        <div><label class="block text-slate-700 mb-1">Flete/aduana %</label>
          <input name="extra_cost_pct" inputmode="decimal" class="w-full border rounded-md px-3 py-2" placeholder="0" /></div>
        <div><label class="block text-slate-700 mb-1">Margen % <span class="text-slate-400">(vacío = categoría)</span></label>
          <input name="margin_pct" inputmode="decimal" class="w-full border rounded-md px-3 py-2" /></div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2"><span class="font-medium">Variantes (talla / color / stock inicial)</span>
          <button type="button" id="add-variant" class="text-brand-700 flex items-center gap-1"><i data-lucide="plus"></i>Agregar</button></div>
        <div id="variants" class="space-y-2"></div>
        <p class="text-xs text-slate-400 mt-1">Si no escribes código de barras, se genera uno interno (EAN-13 prefijo 20) para imprimir etiquetas.</p>
      </div>
      <button class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">Guardar producto</button>
    </form>

    <!-- Vista previa de precio -->
    <aside class="bg-white rounded-2xl border border-slate-200 p-5 h-fit sticky top-5 text-sm">
      <h2 class="font-semibold mb-3 flex items-center gap-2"><i data-lucide="calculator"></i>Cálculo automático</h2>
      <dl id="preview" class="space-y-1.5 text-slate-600"></dl>
      <div class="mt-4 pt-4 border-t">
        <div class="text-slate-500">Precio de venta sugerido</div>
        <div id="pv-price" class="text-3xl font-bold text-slate-900">L 0.00</div>
      </div>
      <label class="block mt-3 text-slate-500">Precio manual (opcional)
        <input id="price-override" inputmode="decimal" class="mt-1 w-full border rounded-md px-3 py-2" placeholder="Usar sugerido" /></label>
    </aside>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const f = document.getElementById('pform');
    const vbox = document.getElementById('variants');
    const pct = (v) => (v === '' || v == null ? null : Number(v));

    function addVariant(v = {}) {
      vbox.insertAdjacentHTML('beforeend', `<div class="grid grid-cols-[1fr_1fr_80px_1fr_32px] gap-2 vrow">
        <input placeholder="Talla" value="${esc(v.size || '')}" class="border rounded-md px-2 py-1.5" data-k="size">
        <input placeholder="Color" value="${esc(v.color || '')}" class="border rounded-md px-2 py-1.5" data-k="color">
        <input placeholder="Stock" inputmode="numeric" class="border rounded-md px-2 py-1.5" data-k="stock">
        <input placeholder="Código de barras" class="border rounded-md px-2 py-1.5" data-k="barcode">
        <button type="button" class="text-slate-400 hover:text-red-600" onclick="this.parentElement.remove()">✕</button></div>`);
    }

    function payload() {
      return {
        name: f.name.value, code: f.code.value || null, brand: f.brand.value || null,
        category_id: Number(f.category_id.value), tax_rate_id: Number(f.tax_rate_id.value) || null,
        cost: toCents(f.cost.value || 0), extra_cost_pct: Number(f.extra_cost_pct.value || 0),
        margin_pct: pct(f.margin_pct.value),
      };
    }

    let t;
    async function preview() {
      clearTimeout(t);
      t = setTimeout(async () => {
        if (!f.category_id.value) return;
        try {
          const p = await api.post('/pricing/preview', payload());
          const row = (a, b) => `<div class="flex justify-between"><dt>${a}</dt><dd class="text-slate-900">${b}</dd></div>`;
          document.getElementById('preview').innerHTML =
            row('Costo bruto', L(p.cost)) + row('Costo puesto en tienda', L(p.landedCost)) +
            row(`Margen aplicado (${p.mode === 'margin' ? 'sobre precio' : 'sobre costo'})`, p.marginPct + ' %') +
            row('Precio sin ISV', L(p.netPrice)) + row(p.taxRate.name, L(p.tax)) +
            row('Utilidad por unidad', `<b class="text-emerald-700">${L(p.profit)}</b>`) +
            row('Margen real s/ precio', p.marginOnPricePct + ' %');
          document.getElementById('pv-price').textContent = L(p.price);
        } catch (e) { toast(e.message, 'error'); }
      }, 200);
    }

    f.addEventListener('input', preview);
    document.getElementById('add-variant').onclick = () => addVariant();

    f.onsubmit = async (e) => {
      e.preventDefault();
      const variants = [...vbox.querySelectorAll('.vrow')].map((r) => {
        const o = {}; r.querySelectorAll('input').forEach((i) => (o[i.dataset.k] = i.value.trim() || null));
        o.stock = Number(o.stock) || 0; return o;
      }).filter((v) => v.size || v.color || v.stock || v.barcode);
      const ov = document.getElementById('price-override').value;
      try {
        const res = await api.post('/products', { ...payload(), variants, price: ov ? toCents(ov) : undefined });
        toast(`Guardado: ${res.variants.length} variante(s) a ${L(res.product.price)}`);
        f.reset(); vbox.innerHTML = ''; addVariant(); preview();
      } catch (err) { toast(err.message, 'error'); }
    };

    (async () => {
      const [cats, taxes] = await Promise.all([api.get('/categories'), api.get('/tax-rates')]);
      f.category_id.innerHTML = cats.map((c) => `<option value="${c.id}">${esc(c.name)} (margen ${c.margin_pct ?? 'global'} %)</option>`).join('');
      f.tax_rate_id.insertAdjacentHTML('beforeend', taxes.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join(''));
      addVariant(); preview(); icons();
    })();
  </script>
</body>
</html>
