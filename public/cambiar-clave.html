<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoe Closet · Cambiar contraseña</title>
  <link rel="icon" href="/favicon.ico" />
  <script src="/vendor/tailwind.js"></script>
  <script src="/js/tw-config.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <style>[data-lucide]{width:1.1em;height:1.1em}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-50 via-white to-sage-100 text-slate-800 antialiased grid place-items-center p-4">
  <main class="w-full max-w-sm">
    <img src="/img/logo.png" alt="Zoe Closet" class="w-48 mx-auto mb-5" />
    <form id="pw-form" class="bg-white rounded-2xl shadow-xl border border-brand-100 p-6 space-y-3">
      <h1 class="text-lg font-semibold text-center">Cambiar contraseña</h1>
      <p id="forced" class="hidden text-sm text-amber-800 bg-amber-50 rounded-lg px-3 py-2">Por seguridad debes definir tu propia contraseña antes de continuar.</p>
      <div><label class="block text-sm text-slate-600 mb-1">Contraseña actual (o temporal)</label>
        <input name="current" type="password" required autocomplete="current-password" maxlength="128" class="w-full border border-slate-200 rounded-lg px-3 py-2" /></div>
      <div><label class="block text-sm text-slate-600 mb-1">Nueva contraseña</label>
        <input name="next" type="password" required autocomplete="new-password" maxlength="128" class="w-full border border-slate-200 rounded-lg px-3 py-2" /></div>
      <div><label class="block text-sm text-slate-600 mb-1">Repetir nueva contraseña</label>
        <input name="next2" type="password" required autocomplete="new-password" maxlength="128" class="w-full border border-slate-200 rounded-lg px-3 py-2" /></div>
      <ul class="text-xs text-slate-500 list-disc pl-5"><li>Mínimo 10 caracteres, con letras y números</li><li>Que no contenga tu usuario</li></ul>
      <p id="pw-error" class="hidden text-sm text-red-700 bg-red-50 rounded-lg px-3 py-2"></p>
      <button class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">Guardar</button>
      <a id="back" href="/" class="hidden block text-center text-sm text-slate-500 hover:underline">Volver</a>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/cambiar-clave.js"></script>
</body>
</html>
