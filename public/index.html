<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoe Closet · Inicio</title>
  <link rel="icon" href="/favicon.ico" />
  <script src="/vendor/tailwind.js"></script>
  <script src="/js/tw-config.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <style>[data-lucide]{width:1.1em;height:1.1em} .tile [data-lucide]{width:1.6rem;height:1.6rem}</style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">
  <header id="app-header" data-page="inicio" class="h-14 bg-white border-b border-slate-200"></header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
      <div>
        <h1 id="greeting" class="text-2xl font-semibold text-slate-900">Bienvenida</h1>
        <p id="today" class="text-sm text-slate-500 first-letter:uppercase"></p>
      </div>
      <div id="status" class="flex flex-wrap gap-2 text-sm"></div>
    </div>

    <section>
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Módulos</h2>
      <div id="modules" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <section id="soon-section" class="hidden mt-8">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Próximamente</h2>
      <div id="soon" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/inicio.js"></script>
</body>
</html>
